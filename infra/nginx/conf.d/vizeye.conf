upstream backend  { server backend:4000;  keepalive 32; }
upstream frontend { server frontend:3000; keepalive 16; }

server {
  listen 80;
  server_name _;
  location = /api/health { proxy_pass http://backend; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name _;
  ssl_certificate     /etc/nginx/ssl/server.crt;
  ssl_certificate_key /etc/nginx/ssl/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location /api/       { proxy_pass http://backend;  include /etc/nginx/conf.d/proxy.conf; }
  location /socket.io/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
  }
  location /_next/static/ { proxy_pass http://frontend; add_header Cache-Control "public,max-age=31536000,immutable"; }
  location / { proxy_pass http://frontend; include /etc/nginx/conf.d/proxy.conf; }
}
