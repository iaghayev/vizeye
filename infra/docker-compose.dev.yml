name: vizeye

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: vizeye_dev_password

  redis:
    command: redis-server --loglevel verbose
    environment: {}

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.dev
      target: development
    container_name: vizeye-backend-dev
    env_file: [.env.dev]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://vizeye:vizeye_dev_password@postgres:5432/vizeye
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    volumes:
      - ../apps/backend/src:/app/src:delegated
      - ../apps/backend/prisma:/app/prisma:delegated
      - backend_node_modules:/app/node_modules
    ports:
      - "4000:4000"
      - "9229:9229"
    command: npm run start:dev

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile.dev
    container_name: vizeye-frontend-dev
    env_file: [.env.dev]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    volumes:
      - ../apps/frontend/src:/app/src:delegated
      - ../apps/frontend/public:/app/public:delegated
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: npm run dev

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: vizeye-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [vizeye-internal]

volumes:
  backend_node_modules:
  frontend_node_modules:
